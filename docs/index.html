<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wedding</title>
    <meta name="robots" content="noindex">
    <!-- Dự phòng khi tắt JS (không giữ query/hash); trong noscript để không tranh với location.replace -->
    <noscript><meta http-equiv="refresh" content="0; url=v1/"></noscript>
    <script>
        // Bản thiệp mặc định cho đường dẫn gốc; đổi ở đây khi chuyển sang bản khác.
        const DEFAULT_VERSION = 'v1';
        location.replace(DEFAULT_VERSION + '/' + location.search + location.hash);
    </script>
</head>
<body>
    <p><a href="v1/">Mở thiệp cưới</a></p>
</body>
</html>
