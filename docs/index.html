<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wedding</title>
    <meta name="robots" content="noindex">
    <!-- data:, chặn trình duyệt tự xin /favicon.ico (404) trong lúc chuyển sang thiệp -->
    <link rel="icon" href="data:,">
    <!-- Dự phòng khi tắt JS (không giữ query/hash); trong noscript để không tranh với location.replace -->
    <noscript><meta http-equiv="refresh" content="0; url=v2/"></noscript>
    <link rel="modulepreload" href="content-loader.js">
    <link rel="modulepreload" href="firebase-shared.js">
    <style>
        html, body { margin: 0; min-height: 100%; }
        body {
            display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh;
            padding: 24px; box-sizing: border-box; background: #fbf6f1; color: #4a3b3f;
            font: 16px/1.5 Georgia, "Times New Roman", serif; text-align: center;
        }
        a { color: inherit; }
        .router-wait { margin: 0; font-size: 15px; color: #8a7a7e; }
    </style>
    <script nomodule>
        // Trình duyệt không chạy được module: mở thiệp luôn.
        location.replace('v2/' + location.search + location.hash);
    </script>
    <script type="module">
        // Đường dẫn gốc luôn mở thiệp v2 (chỉ còn một phiên bản), giữ nguyên ?code= và #hash. Trước khi
        // chuyển, đọc bản xuất bản một lần (content-loader.js): đây là lần chờ Firestore duy nhất của lượt,
        // content-loader.js chuyển kết quả cho trang thiệp, trang đó không đọc/chờ lại. /v2/ mở trực tiếp
        // không qua đây.
        const target = `v2/${location.search}${location.hash}`;

        document.querySelector('#router-wait a').href = target;
        (async () => {
            try {
                const { preloadPublished } = await import('./content-loader.js');
                await preloadPublished();
            } catch (error) {
                console.warn('Không đọc trước được bản xuất bản, thiệp sẽ tự đọc:', error.message);
            }
            location.replace(target);
        })();
    </script>
</head>
<body>
    <p class="router-wait" id="router-wait">Đang mở thiệp… <a href="v2/">Mở thiệp cưới</a></p>
</body>
</html>
