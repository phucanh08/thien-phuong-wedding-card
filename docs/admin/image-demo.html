<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Thử tải ảnh · Quản lý thiệp cưới</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="image-cropper.css">
</head>
<body>
  <main class="container py-4" style="max-width: 640px">
    <h1 class="h4 brand mb-1">Thử tải ảnh</h1>
    <p class="text-secondary small">Trang thử nghiệm: cắt ảnh theo ô, nén WebP trên máy, tải lên R2 qua Worker.</p>

    <form id="demo-login" class="card card-body mb-3 d-flex flex-column gap-2" hidden>
      <label class="form-label mb-0" for="demo-user">Tên đăng nhập hoặc email</label>
      <input id="demo-user" class="form-control" autocomplete="username" required>
      <label class="form-label mb-0" for="demo-pass">Mật khẩu</label>
      <input id="demo-pass" class="form-control" type="password" autocomplete="current-password" required>
      <button class="btn btn-rose" type="submit">Đăng nhập</button>
      <div id="demo-login-error" class="text-danger small" role="alert"></div>
    </form>

    <section id="demo-main" hidden>
      <p class="small mb-2">Đăng nhập: <span id="demo-who"></span></p>
      <label class="form-label" for="demo-kind">Loại ô</label>
      <select id="demo-kind" class="form-select mb-3">
        <option value="portrait">Chân dung (2:3)</option>
        <option value="cover">Bìa (2:3)</option>
        <option value="event">Sự kiện (7:6)</option>
        <option value="story">Chuyện tình (2:3)</option>
        <option value="album">Album (giữ tỉ lệ gốc)</option>
        <option value="qr">Mã QR (1:1)</option>
      </select>
      <div id="demo-picker" class="card card-body mb-3"></div>
      <div id="demo-result" class="card card-body small" hidden>
        <dl class="row mb-2" id="demo-result-list"></dl>
        <div class="d-flex gap-2 align-items-start">
          <img id="demo-large" alt="Bản lớn" style="max-width: 60%; height: auto">
          <img id="demo-small" alt="Bản nhỏ" style="max-width: 35%; height: auto">
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="image-demo.js"></script>
</body>
</html>
