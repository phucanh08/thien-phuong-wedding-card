<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wedding</title>
    <meta name="robots" content="noindex">
    <!-- data:, chặn trình duyệt tự xin /favicon.ico (404) trong lúc chuyển sang thiệp -->
    <link rel="icon" href="data:,">
    <!-- Thiệp nằm ở gốc site: link /v2/ cũ (kể cả /v2/index.html) chuyển về /, giữ ?code= và #hash.
         Dự phòng khi tắt JS (không giữ query/hash) nằm trong noscript để không tranh với location.replace. -->
    <noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
    <script>
        // Trang gốc bản cũ (chuyển sang /v2/) có thể còn trong cache trình duyệt vài phút sau khi site cập
        // nhật: chuyển về gốc lại mở bản cũ, bản đó lại đưa sang đây. Tới đây lần thứ hai liên tiếp trong
        // cùng tab thì tải lại trang gốc bỏ qua cache rồi mới chuyển, để không chuyển qua lại mãi.
        (function () {
            var target = '../' + location.search + location.hash;
            var key = 'weddingCard:legacyRedirect';
            var now = Date.now();
            var last = 0;
            try {
                last = Number(sessionStorage.getItem(key)) || 0;
                sessionStorage.setItem(key, String(now));
            } catch (e) {
                // storage bị chặn: chuyển ngay
            }
            if (!(now - last < 10000) || typeof fetch !== 'function') {
                location.replace(target);
                return;
            }
            // Mạng treo thì không chờ quá 3s
            var done = false;
            var go = function () {
                if (!done) {
                    done = true;
                    location.replace(target);
                }
            };
            setTimeout(go, 3000);
            fetch('../' + location.search, { cache: 'reload' }).catch(function () {}).then(go);
        })();
    </script>
</head>
<body>
    <p><a href="../">Mở thiệp cưới</a></p>
</body>
</html>
